[package]
name = "block_chain_demo"
version = "0.1.0"
edition = "2024"
authors = ["Dereck Monge <dmonge1106@email.com>"]
description = "Una implementación educativa de blockchain en Rust con proof-of-work"
license = "MIT"
readme = "README.md"

[lib]
name = "block_chain_demo"
path = "src/lib.rs"
 
[[bin]]
name = "block_chain_demo"
path = "src/main.rs"
 
[dependencies]
sha2 = "0.10"
chrono = "0.4"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
 
[profile.release]
opt-level = 3
lto = true